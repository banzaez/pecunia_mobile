name: pecunia
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.9+23

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  countries_flag: ^1.0.0
  cupertino_icons: ^1.0.8
  currency_picker: ^2.0.21
  intl: ^0.20.2
  get: 5.0.0-release-candidate-9.3.2
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  fl_chart: ^1.0.0
  flutter_multi_formatter: ^2.13.7
  file_picker: ^10.2.0
  json_annotation: ^4.9.0
  package_info_plus: ^8.3.0
  phone_numbers_parser: ^9.0.3
  restart_app: ^1.3.2
  sqflite: ^2.4.2
  url_launcher: ^6.3.1

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6


  firebase_core: ^3.15.0
  firebase_auth: ^5.6.1
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  google_sign_in: ^7.1.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4
  json_serializable: ^6.9.5


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/play_store_512.png"
  min_sdk_android: 23
  image_path_android: "assets/app_icon/ic_launcher.png"
  adaptive_icon_background: "assets/app_icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/app_icon/ic_launcher_foreground.png"


flutter_native_splash:
  color: "#2397f3"
  image: assets/app_icon/logo.png
  android: true


flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/
    - assets/png/
