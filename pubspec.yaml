name: pecunia
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.1+30

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  go_router: ^17.3.0

  cupertino_icons: ^1.0.9
  currency_picker: ^2.0.22
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  file_picker: ^12.0.0-beta.5
  json_annotation: ^4.12.0
  package_info_plus: ^10.1.0
  sqflite: ^2.4.3
  url_launcher: ^6.3.2

  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2

  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  json_serializable: ^6.14.0

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  retrofit_generator: ^10.2.6
  riverpod_generator: ^4.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/play_store_512.png"
  min_sdk_android: 23
  image_path_android: "assets/app_icon/ic_launcher.png"
  adaptive_icon_background: "assets/app_icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/app_icon/ic_launcher_foreground.png"

flutter_native_splash:
  color: "#2397f3"
  image: assets/app_icon/logo.png
  android: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon/
    - assets/png/
