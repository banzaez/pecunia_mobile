name: pecunia
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+13

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  countries_flag: ^1.0.0
  cupertino_icons: ^1.0.8
  currency_picker: ^2.0.21
  intl: ^0.19.0
  get: 5.0.0-release-candidate-9.2.1
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  flutter_multi_formatter: ^2.13.0
  file_picker: ^8.1.2
  json_annotation: ^4.9.0
  package_info_plus: ^8.0.3
  phone_numbers_parser: ^9.0.1
  restart_app: ^1.3.2
  sqflite: ^2.4.0
  url_launcher: ^6.3.1

  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  json_serializable: ^6.8.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/play_store_512.png"
  min_sdk_android: 23
  image_path_android: "assets/app_icon/ic_launcher.png"
  adaptive_icon_background: "assets/app_icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/app_icon/ic_launcher_foreground.png"


flutter_native_splash:
  color: "#2397f3"
  image: assets/app_icon/logo.png
  android: true


flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/
