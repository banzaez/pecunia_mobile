name: pecunia
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.13+28

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  countries_flag: ^1.0.0
  cupertino_icons: ^1.0.8
  currency_picker: ^2.0.21
  intl: ^0.20.2
  get: 5.0.0-release-candidate-9.3.2
  get_storage: ^2.1.1
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1
  file_picker: ^10.3.6
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  restart_app: ^1.3.2
  sqflite: ^2.4.2
  url_launcher: ^6.3.2

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2

  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.10.3
  json_serializable: ^6.11.1


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/play_store_512.png"
  min_sdk_android: 23
  image_path_android: "assets/app_icon/ic_launcher.png"
  adaptive_icon_background: "assets/app_icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/app_icon/ic_launcher_foreground.png"


flutter_native_splash:
  color: "#2397f3"
  image: assets/app_icon/logo.png
  android: true


flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/
    - assets/png/
